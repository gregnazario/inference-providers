name: ci
on:
  push: { branches: ["**"] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @inference-providers/schema run build
      - run: pnpm --filter @inference-providers/sdk run build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm validate
      - run: pnpm emit
      - run: pnpm --filter site run build
      - run: git diff --exit-code dist/ || (echo "dist/ is generated, do not commit; CI regenerates it" && exit 1)
