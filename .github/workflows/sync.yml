name: sync
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @inference-providers/schema run build
      - run: pnpm --filter @inference-providers/sdk run build
      - run: pnpm emit
      - run: pnpm --filter @inference-providers/sync run report
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          BASETEN_API_KEY: ${{ secrets.BASETEN_API_KEY }}
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          SYNTHETIC_API_KEY: ${{ secrets.SYNTHETIC_API_KEY }}
          NEAR_AI_API_KEY: ${{ secrets.NEAR_AI_API_KEY }}
          IOINTELLIGENCE_API_KEY: ${{ secrets.IOINTELLIGENCE_API_KEY }}
          HETZNER_API_KEY: ${{ secrets.HETZNER_API_KEY }}
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: sync-report
          path: .superpowers/sync-report.json
      - name: Open or update drift issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { execSync } from "node:child_process";
            const r = JSON.parse(readFileSync(".superpowers/sync-report.json", "utf8"));
            const reports = r.reports ?? [];
            const cap = (ids) => {
              const shown = ids.slice(0, 50).map((x) => "- `" + x + "`").join("\n");
              return ids.length > 50 ? shown + "\n- … and " + (ids.length - 50) + " more" : shown;
            };
            // The issue fires only on removals — a removal means the catalog
            // may be broken. Additions alone are uncataloged leads and stay in
            // the sync-report artifact.
            if (!reports.some((d) => d.removed.length > 0)) {
              console.log("no removals — issue not opened");
              process.exit(0);
            }
            const body = reports
              .map(
                (d) =>
                  `## ${d.providerId}` +
                  (d.removed.length
                    ? "\n\n**Removed (action needed):**\n" + cap(d.removed)
                    : "") +
                  (d.added.length
                    ? "\n\n**Added (uncataloged leads):**\n" + cap(d.added)
                    : "")
              )
              .join("\n\n") +
              "\n\n---\n\nDetected by the daily sync run. Removed wire ids are no longer live and need catalog fixes; added ones are uncataloged leads. Offerings land only after human verification with sources — see the Verify page.";
            const title = "Provider drift detected";
            const existing = execSync(
              `gh issue list --repo "$GITHUB_REPOSITORY" --search "in:title is:open ${title}" --state open --json number --jq ".[0].number // empty"`,
              { env: process.env }
            )
              .toString()
              .trim();
            if (existing) {
              execSync(`gh issue comment "${existing}" --repo "$GITHUB_REPOSITORY" --body-file -`, {
                input: body,
                env: process.env,
              });
            } else {
              execSync(`gh issue create --repo "$GITHUB_REPOSITORY" --title "${title}" --body-file -`, {
                input: body,
                env: process.env,
              });
            }
            console.log("drift issue updated");
          '
      # Staleness tripwire: provenance older than 180 days fails here, turning
      # the daily run red until facts are re-verified (drift handling already ran).
      - run: pnpm validate
