packages:
  - "packages/*"
  - "site"
allowBuilds:
  esbuild: true
  sharp: true
minimumReleaseAgeExclude:
  - '@bruits/satteri-darwin-arm64@0.10.5'
  - '@bruits/satteri-darwin-x64@0.10.5'
  - '@bruits/satteri-linux-arm64-gnu@0.10.5'
  - '@bruits/satteri-linux-arm64-musl@0.10.5'
  - '@bruits/satteri-linux-x64-gnu@0.10.5'
  - '@bruits/satteri-linux-x64-musl@0.10.5'
  - '@bruits/satteri-wasm32-wasi@0.10.5'
  - '@bruits/satteri-win32-arm64-msvc@0.10.5'
  - '@bruits/satteri-win32-x64-msvc@0.10.5'
  - satteri@0.10.5
overrides:
  # satteri@0.10.4 (pulled in by astro 7's @astrojs/markdown-satteri) pins
  # @bruits/satteri-darwin-arm64@0.10.4, which was never published to npm —
  # every other platform got a 0.10.4 binary. Without the override, builds on
  # Apple Silicon crash loading the missing native module. 0.10.5 has complete
  # platform publishes and satisfies markdown-satteri's ^0.10.3 range; drop
  # this once a markdown-satteri depends on >=0.10.5.
  satteri: 0.10.5
