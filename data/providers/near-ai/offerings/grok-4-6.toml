model = "xai/grok-4-6"
wire_id = "x-ai/grok-4.6"
endpoint = "chat"
status = "ga"
status_date = ""

[cost]
input = 2
output = 6
cache_read = 0.5
source = { url = "https://cloud-api.near.ai/v1/models", verified = "2026-09-20" }

[limits]
context = 500000
output = 450000
source = { url = "https://cloud-api.near.ai/v1/models", verified = "2026-09-20" }

[features]
streaming = true
tools = true
structured_output = true
prompt_caching = true
vision = false

[reasoning]
style = "effort"
mandatory = false
default = "on"
returns = "reasoning_content"
must_round_trip = ""
notes = "xAI documents reasoning_effort for the 4.5/4.6 line; NEAR gateway control undocumented — verify."

[reasoning.effort]
param = "reasoning_effort"
values = ["low", "medium", "high", "xhigh"]
default = "low"

[reasoning.source]
url = "https://docs.near.ai/cloud/reasoning-models/"
verified = "2026-09-20"
