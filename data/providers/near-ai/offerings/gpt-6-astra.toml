model = "openai/gpt-6"
wire_id = "openai/gpt-6-astra"
endpoint = "chat"
status = "ga"
status_date = ""

[cost]
input = 10
output = 50
cache_read = 1
notes = "Short-context tier; over 272K tokens $20/$75 (OpenAI list; NEAR pricing shown)."
source = { url = "https://cloud-api.near.ai/v1/models", verified = "2026-09-10" }

[limits]
context = 1050000
output = 128000
source = { url = "https://cloud-api.near.ai/v1/models", verified = "2026-09-10" }

[features]
streaming = true
tools = false
structured_output = true
prompt_caching = true
vision = true

[reasoning]
style = "effort"
mandatory = true
default = "on"
returns = "reasoning_content"
must_round_trip = ""
notes = "NEAR lists reasoning in supported features; effort low-max with no none upstream, default undocumented — verify."

[reasoning.effort]
param = "reasoning_effort"
values = ["low", "medium", "high", "xhigh", "max"]
default = "medium"

[reasoning.source]
url = "https://cloud-api.near.ai/v1/models"
verified = "2026-09-10"
