model = "openai/o3"
wire_id = "openai/o3"
endpoint = "chat"
status = "ga"
status_date = ""
[cost]
input = 2
output = 8
cache_read = 0.5
source = { url = "https://cloud-api.near.ai/v1/models", verified = "2026-08-28" }
[limits]
context = 200000
output = 32768
source = { url = "https://cloud-api.near.ai/v1/models", verified = "2026-08-28" }
[features]
streaming = true
tools = true
structured_output = true
prompt_caching = true
vision = true
[reasoning]
style = "effort"
mandatory = true
default = "on"
returns = "reasoning_content"
must_round_trip = ""

[reasoning.effort]
param = "reasoning_effort"
values = ["low", "medium", "high", "xhigh", "max"]
default = "medium"

[reasoning.source]
url = "https://cloud-api.near.ai/v1/models"
verified = "2026-08-28"
