model = "openai/gpt-5-6"
wire_id = "openai/gpt-5.6-luna"
endpoint = "chat"
status = "ga"
status_date = ""
[cost]
input = 0.2
output = 1.2
cache_read = 0.02
source = { url = "https://cloud-api.near.ai/v1/models", verified = "2026-09-04" }
[limits]
context = 1050000
output = 128000
source = { url = "https://cloud-api.near.ai/v1/models", verified = "2026-09-04" }
[features]
streaming = true
tools = true
structured_output = true
prompt_caching = true
vision = true
[reasoning]
style = "effort"
mandatory = false
default = "on"
notes = "GPT-5.6 cost tier; reasoning.mode standard|pro upstream."
returns = "reasoning_content"
must_round_trip = ""

[reasoning.effort]
param = "reasoning_effort"
values = ["none", "low", "medium", "high", "xhigh", "max"]
default = "medium"

[reasoning.source]
url = "https://cloud-api.near.ai/v1/models"
verified = "2026-09-04"
