model = "openai/gpt-6"
wire_id = "openai/gpt-6-luna"
endpoint = "chat"
status = "ga"
status_date = ""

[cost]
input = 0.1
output = 0.5
cache_read = 0.01
source = { url = "https://cloud-api.near.ai/v1/models", verified = "2026-09-23" }

[limits]
context = 1050000
output = 128000
source = { url = "https://cloud-api.near.ai/v1/models", verified = "2026-09-23" }

[features]
streaming = true
tools = false
structured_output = true
prompt_caching = true
vision = true

[reasoning]
style = "effort"
mandatory = true
default = "on"
returns = "reasoning_content"
must_round_trip = ""
notes = "GPT-6 family: effort low-max with no none; NEAR gateway default undocumented — verify."

[reasoning.effort]
param = "reasoning_effort"
values = ["low", "medium", "high", "xhigh", "max"]
default = "medium"

[reasoning.source]
url = "https://cloud-api.near.ai/v1/models"
verified = "2026-09-23"
