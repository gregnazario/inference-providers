model = "openai/gpt-5-6"
wire_id = "gpt-5.6"
endpoint = "v1-responses"
status = "ga"
status_date = ""

[cost]
input = 2.0
output = 12.0
cache_read = 0.2
cache_write = 2.5
notes = "Bills as the Terra tier; variant prices: sol 5/30, luna 0.2/1.2, tiered over 200k — verify mapping."
source = { url = "https://azure.microsoft.com/en-us/blog/gpt-5-6-now-available-in-microsoft-foundry/", verified = "2026-08-20" }

[reasoning]
style = "effort"
mandatory = false
default = "on"
notes = "Same per-model matrix as OpenAI: none default on 5.1, xhigh on 5.4+, max on 5.6 Responses."
returns = "reasoning_summary"
must_round_trip = "encrypted_content"
incompatible_with = ["temperature", "top_p", "max_tokens"]

[reasoning.effort]
param = "reasoning.effort"
values = ["none", "low", "medium", "high", "xhigh", "max"]
default = "medium"

[reasoning.source]
url = "https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/reasoning"
verified = "2026-08-18"
