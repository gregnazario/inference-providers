model = "moonshot/kimi-k2-6"
wire_id = "kimi-k2.6"
endpoint = "chat-completions"
status = "ga"
status_date = ""

[cost]
input = 0.95
output = 4.0
cache_read = 0.16
free = false
source = { url = "https://platform.kimi.ai/docs/models", verified = "2026-08-19" }

[limits]
context = 262_144
source = { url = "https://platform.kimi.ai/docs/models", verified = "2026-08-19" }

[reasoning]
style = "toggle"
mandatory = false
default = "on"
notes = "thinking.keep: null (default, drops reasoning history) or all (Preserved Thinking)."
returns = "reasoning_content"
must_round_trip = "reasoning_content"
incompatible_with = ["temperature", "top_p", "n", "presence_penalty", "frequency_penalty"]

[reasoning.toggle]
param = "thinking.type"
on = "enabled"
off = "disabled"

[reasoning.source]
url = "https://platform.kimi.ai/docs/guide/use-thinking-models"
verified = "2026-08-19"
