model = "alibaba/qwen3-7-plus"
wire_id = "qwen3.7-plus"
endpoint = "compatible-mode-chat"
status = "ga"
status_date = ""

[cost]
input = 0.4
output = 1.6
notes = "≤256k tier; 256k–1M is 1.20/4.80; cache hits billed at 10% of input (rule-based); limited-time promos may apply."
source = { url = "https://www.alibabacloud.com/help/en/model-studio/model-pricing", verified = "2026-08-20" }

[limits]
context = 1_048_576
output = 65_536
source = { url = "https://www.alibabacloud.com/blog/qwen3-7-plus-multimodal-agent-intelligence_603206", verified = "2026-08-20" }

[reasoning]
style = "toggle"
mandatory = false
default = "on"
notes = "Qwen3.7/3.6/3.5 series default thinking ON. preserve_thinking carries reasoning_content across turns."
returns = "reasoning_content"
must_round_trip = "reasoning_content"

[reasoning.toggle]
param = "enable_thinking"
on = "true"
off = "false"

[reasoning.source]
url = "https://www.alibabacloud.com/help/en/model-studio/deep-thinking"
verified = "2026-08-18"
