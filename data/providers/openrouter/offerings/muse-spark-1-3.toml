model = "meta/muse-spark-1-3"
wire_id = "meta/muse-spark-1.3"
endpoint = "chat-completions"
status = "ga"
status_date = ""
[cost]
input = 1.25
output = 4.25
cache_read = 0.15
source = { url = "https://openrouter.ai/api/v1/models", verified = "2026-09-04" }
[limits]
context = 1048576
source = { url = "https://openrouter.ai/api/v1/models", verified = "2026-09-04" }
[features]
streaming = true
tools = true
structured_output = true
prompt_caching = true
vision = true
[reasoning]
style = "effort"
mandatory = true
default = "on"
notes = "Muse Spark 1.2 lineage: always-on reasoning (effort none returned 400 upstream). 1.3 adds audio+video input; long-context tuned."
returns = "reasoning_content"
must_round_trip = "reasoning_content"

[reasoning.effort]
param = "reasoning.effort"
values = ["low", "medium", "high", "xhigh", "max"]
default = "medium"

[reasoning.source]
url = "https://openrouter.ai/api/v1/models"
verified = "2026-09-04"
