model = "amazon/nova-2-lite"
wire_id = "amazon/nova-2-lite-v1"
endpoint = "chat-completions"
status = "ga"
status_date = ""
[cost]
input = 0.3
output = 2.5
source = { url = "https://openrouter.ai/api/v1/models", verified = "2026-08-28" }
[limits]
context = 1000000
source = { url = "https://openrouter.ai/api/v1/models", verified = "2026-08-28" }
[features]
streaming = true
tools = true
structured_output = true
prompt_caching = false
vision = true
[reasoning]
style = "effort"
mandatory = false
default = "off"
notes = "Nova 2 Lite reasons only when enabled: Bedrock reasoningConfig.type defaults to disabled; OR normalizes to its reasoning parameter. maxReasoningEffort low/medium/high upstream."
returns = "reasoning_content"
must_round_trip = ""

[reasoning.effort]
param = "reasoning.effort"
values = ["low", "medium", "high"]
default = "low"

[reasoning.source]
url = "https://openrouter.ai/api/v1/models"
verified = "2026-08-28"
