model = "anthropic/claude-fable-5"
wire_id = "anthropic/claude-fable-5"
endpoint = "chat-completions"
status = "ga"
status_date = ""

[cost]
input = 10.0
output = 50.0
cache_read = 1.0
source = { url = "https://openrouter.ai/api/v1/models", verified = "2026-08-20" }

[reasoning]
style = "effort"
mandatory = true
default = "on"
returns = "reasoning_content"
must_round_trip = "reasoning_content"
notes = "thinking cannot be disabled on fable-5; effort none maps to thinking.type disabled which errors upstream."

[reasoning.effort]
param = "reasoning.effort"
values = ["low", "medium", "high", "xhigh", "max"]
default = "high"

[reasoning.source]
url = "https://openrouter.ai/api/v1/models"
verified = "2026-08-19"
