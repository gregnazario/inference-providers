model = "openai/gpt-5-4"
wire_id = "openai/gpt-5.4"
endpoint = "chat-completions"
status = "ga"
status_date = ""
[cost]
input = 2.5
output = 15
cache_read = 0.25
source = { url = "https://openrouter.ai/api/v1/models", verified = "2026-08-28" }
[limits]
context = 1050000
source = { url = "https://openrouter.ai/api/v1/models", verified = "2026-08-28" }
[features]
streaming = true
tools = true
structured_output = true
prompt_caching = true
vision = true
[reasoning]
style = "effort"
mandatory = false
default = "off"
notes = "Default effort is none. Prompts over 272K billed 2x input / 1.5x output for the session."
returns = "reasoning_content"
must_round_trip = "reasoning_content"

[reasoning.effort]
param = "reasoning.effort"
values = ["none", "low", "medium", "high", "xhigh"]
default = "none"

[reasoning.source]
url = "https://openrouter.ai/api/v1/models"
verified = "2026-08-28"
