model = "openai/gpt-6"
wire_id = "openai/gpt-6-luna"
endpoint = "chat-completions"
status = "ga"
status_date = ""

[cost]
input = 0.1
output = 0.5
cache_read = 0.01
notes = "Fast cost tier for high-volume, latency-sensitive workloads."
source = { url = "https://openrouter.ai/api/v1/models", verified = "2026-09-23" }

[limits]
context = 1050000
source = { url = "https://openrouter.ai/api/v1/models", verified = "2026-09-23" }

[features]
streaming = true
tools = true
structured_output = true
prompt_caching = true
vision = true

[reasoning]
style = "effort"
mandatory = true
default = "on"
returns = "reasoning_content"
must_round_trip = "reasoning_content"
notes = "GPT-6 family: effort low-max with no none; default undocumented — verify."

[reasoning.effort]
param = "reasoning.effort"
values = ["low", "medium", "high", "xhigh", "max"]
default = "medium"

[reasoning.source]
url = "https://openrouter.ai/api/v1/models"
verified = "2026-09-23"
