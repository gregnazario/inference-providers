model = "nvidia/nemotron-3-nano"
wire_id = "nvidia/nemotron-3-nano-30b-a3b"
endpoint = "chat-completions"
status = "ga"
status_date = ""
[cost]
input = 0.05
output = 0.2
cache_read = 0.025
source = { url = "https://openrouter.ai/api/v1/models", verified = "2026-08-28" }
[limits]
context = 262144
source = { url = "https://openrouter.ai/api/v1/models", verified = "2026-08-28" }
[features]
streaming = true
tools = true
structured_output = true
