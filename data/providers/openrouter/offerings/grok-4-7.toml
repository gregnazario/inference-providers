model = "xai/grok-4-7"
wire_id = "x-ai/grok-4.7"
endpoint = "chat-completions"
status = "ga"
status_date = ""

[cost]
input = 1.6
output = 4.8
cache_read = 0.4
source = { url = "https://openrouter.ai/api/v1/models", verified = "2026-09-23" }

[limits]
context = 500000
source = { url = "https://openrouter.ai/api/v1/models", verified = "2026-09-23" }

[features]
streaming = true
tools = true
structured_output = true
prompt_caching = true
vision = true

[reasoning]
style = "effort"
mandatory = false
default = "on"
returns = "reasoning_content"
must_round_trip = "reasoning_content"
notes = "Strong at long-running software engineering with self-verification; xAI list is $2/$6 up to 200K prompt, $4/$12 above."

[reasoning.effort]
param = "reasoning.effort"
values = ["low", "medium", "high", "xhigh"]
default = "low"

[reasoning.source]
url = "https://openrouter.ai/api/v1/models"
verified = "2026-09-23"
