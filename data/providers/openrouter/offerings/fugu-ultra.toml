model = "sakana/fugu-ultra"
wire_id = "sakana/fugu-ultra"
endpoint = "chat-completions"
status = "ga"
status_date = ""

[cost]
input = 5.0
output = 30.0
cache_read = 0.5
source = { url = "https://openrouter.ai/api/v1/models", verified = "2026-08-28" }

[limits]
context = 1000000
source = { url = "https://openrouter.ai/api/v1/models", verified = "2026-08-28" }

[features]
streaming = true
tools = true
structured_output = true
prompt_caching = true
vision = true

[reasoning]
style = "effort"
mandatory = false
default = "on"
returns = "reasoning_content"
must_round_trip = "reasoning_content"
notes = "Sakana multi-agent-as-a-model; reasoning_effort exposed but semantics undocumented — verify."

[reasoning.effort]
param = "reasoning.effort"
values = ["none", "low", "medium", "high", "xhigh", "max"]
default = "medium"

[reasoning.source]
url = "https://openrouter.ai/api/v1/models"
verified = "2026-08-28"
