model = "openai/gpt-6"
wire_id = "openai/gpt-6-astra"
endpoint = "chat-completions"
status = "ga"
status_date = ""

[cost]
input = 10
output = 50
cache_read = 1
notes = "Short-context tier; over 272K tokens $20/$75."
source = { url = "https://openrouter.ai/api/v1/models", verified = "2026-09-10" }

[limits]
context = 1050000
source = { url = "https://openrouter.ai/api/v1/models", verified = "2026-09-10" }

[features]
streaming = true
tools = true
structured_output = true
prompt_caching = true
vision = true

[reasoning]
style = "effort"
mandatory = true
default = "on"
returns = "reasoning_content"
must_round_trip = "reasoning_content"
notes = "OpenAI docs list effort low/medium/high/xhigh/max with no none (thinking cannot be disabled); default undocumented — verify."

[reasoning.effort]
param = "reasoning.effort"
values = ["low", "medium", "high", "xhigh", "max"]
default = "medium"

[reasoning.source]
url = "https://openrouter.ai/api/v1/models"
verified = "2026-09-10"
