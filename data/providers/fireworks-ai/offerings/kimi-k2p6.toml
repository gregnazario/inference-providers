endpoint = "inference-v1"
status = "ga"
status_date = ""

[cost]
input = 0.95
output = 4.00
cache_read = 0.16
source = { url = "https://docs.fireworks.ai/serverless/pricing", verified = "2026-08-19" }

[limits]
context = 262_144
