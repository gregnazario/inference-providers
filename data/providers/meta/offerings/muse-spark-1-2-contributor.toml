model = "meta/muse-spark-1-2"
wire_id = "muse-spark-1.2-contributor"
endpoint = "v1-responses"
status = "ga"
status_date = ""

[cost]
input = 0.10
output = 0.20
cache_read = 0.002
free = false
source = { url = "https://dev.meta.ai/docs/pricing-rate-limits/", verified = "2026-08-19" }

[limits]
context = 1_048_576
output = 131_072
source = { url = "https://dev.meta.ai/docs/pricing-rate-limits/", verified = "2026-08-19" }

[reasoning]
style = "effort"
mandatory = true
default = "on"
notes = "Contributor tier: heavy discount in exchange for prompts possibly training future Meta models."
returns = "reasoning_summary"
must_round_trip = "encrypted_content"

[reasoning.effort]
param = "reasoning.effort"
values = ["minimal", "low", "medium", "high", "xhigh"]
default = "medium"
notes = "Default effort is not documented — verify."

[reasoning.source]
url = "https://dev.meta.ai/docs/reasoning"
verified = "2026-08-19"
