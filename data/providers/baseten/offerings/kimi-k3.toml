[reasoning.effort]
param = "reasoning_effort"
values = ["none", "low", "high", "max"]
default = "max"
notes = "none disables reasoning."

[reasoning.source]
url = "https://docs.baseten.co/inference/model-apis/reasoning"
verified = "2026-08-19"
