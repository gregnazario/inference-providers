model = "moonshot/kimi-k3"
wire_id = "moonshotai/Kimi-K3"
endpoint = "chat-completions"
status = "ga"
status_date = ""

[cost]
input = 3.00
output = 15.00
cache_read = 0.30
source = { url = "https://www.baseten.co/pricing/", verified = "2026-08-19" }

[limits]
context = 1_048_576
source = { url = "https://docs.baseten.co/inference/model-apis/overview", verified = "2026-08-19" }

[reasoning]
style = "effort"
mandatory = false
default = "on"
returns = "reasoning_content"
