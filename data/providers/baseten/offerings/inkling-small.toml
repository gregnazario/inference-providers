model = "thinkingmachines/inkling-small"
wire_id = "thinkingmachines/inkling-small"
endpoint = "chat-completions"
status = "ga"
status_date = ""

[cost]
input = 0.50
output = 1.20
cache_read = 0.10
source = { url = "https://www.baseten.co/pricing/", verified = "2026-08-19" }

[limits]
context = 1_048_576
output = 32_768
source = { url = "https://docs.baseten.co/inference/model-apis/overview", verified = "2026-08-19" }

[reasoning]
style = "effort"
mandatory = false
default = "on"
notes = "Billed as completion tokens; enable_thinking unvalidated per Baseten docs."
returns = "reasoning_content"
must_round_trip = "reasoning_content"

[reasoning.effort]
param = "reasoning_effort"
values = ["none", "low", "high"]
default = "high"
notes = "Default high; none disables reasoning."

[reasoning.source]
url = "https://docs.baseten.co/inference/model-apis/reasoning"
verified = "2026-08-19"
