model = "openai/gpt-5-1"
wire_id = "gpt-5.1"
endpoint = "v1-responses"
status = "ga"
status_date = ""

[limits]
context = 400_000
output = 128_000
source = { url = "https://developers.openai.com/api/docs/models", verified = "2026-08-19" }

[reasoning]
style = "effort"
mandatory = false
default = "off"
returns = "reasoning_summary"
must_round_trip = "encrypted_content"
incompatible_with = ["temperature", "top_p"]

[reasoning.effort]
param = "reasoning.effort"
values = ["none", "low", "medium", "high"]
default = "none"

[reasoning.source]
url = "https://developers.openai.com/api/docs/guides/reasoning"
verified = "2026-08-18"
