model = "openai/gpt-5-5"
wire_id = "gpt-5.5"
endpoint = "v1-responses"
status = "ga"
status_date = ""

[cost]
input = 5.0
output = 30.0
cache_read = 0.5
notes = "Prompts >272K billed 2x input / 1.5x output; GPT-5.5-Pro variant is 30/180."
source = { url = "https://developers.openai.com/api/docs/models/gpt-5.5", verified = "2026-08-21" }

[limits]
context = 1_050_000
output = 128_000
source = { url = "https://developers.openai.com/api/docs/models/gpt-5.5", verified = "2026-08-21" }

[reasoning]
style = "effort"
mandatory = false
default = "on"
returns = "reasoning_summary"
must_round_trip = "encrypted_content"
incompatible_with = ["temperature", "top_p"]

[reasoning.effort]
param = "reasoning.effort"
values = ["none", "low", "medium", "high", "xhigh"]
default = "medium"

[reasoning.source]
url = "https://developers.openai.com/api/docs/models/gpt-5.5"
verified = "2026-08-21"
