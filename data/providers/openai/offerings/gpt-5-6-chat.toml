model = "openai/gpt-5-6"
wire_id = "gpt-5.6"
endpoint = "v1-chat-completions"
status = "ga"
status_date = ""

[cost]
input = 2.0
output = 12.0
cache_read = 0.2
notes = "Plain gpt-5.6 id bills as Terra; variant prices: sol 5/30, luna 0.2/1.2, tiered over 200k — verify mapping."
source = { url = "https://developers.openai.com/api/docs/pricing", verified = "2026-08-20" }

[limits]
context = 400_000
output = 128_000
source = { url = "https://developers.openai.com/api/docs/models", verified = "2026-08-19" }

[reasoning]
style = "effort"
mandatory = false
default = "on"
notes = "tools + reasoning_effort conflict on Chat Completions: use effort none or the Responses endpoint."
returns = "hidden"
must_round_trip = ""

[reasoning.effort]
param = "reasoning_effort"
values = ["none", "low", "medium", "high", "xhigh"]
default = "medium"

[reasoning.source]
url = "https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/reasoning"
verified = "2026-08-18"
