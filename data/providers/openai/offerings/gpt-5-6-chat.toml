model = "openai/gpt-5-6"
wire_id = "gpt-5.6"
endpoint = "v1-chat-completions"
status = "ga"
status_date = ""

[limits]
context = 400_000
output = 128_000
source = { url = "https://developers.openai.com/api/docs/models", verified = "2026-08-19" }

[reasoning]
style = "effort"
mandatory = false
default = "on"
notes = "tools + reasoning_effort conflict on Chat Completions: use effort none or the Responses endpoint."
returns = "hidden"
must_round_trip = ""

[reasoning.effort]
param = "reasoning_effort"
values = ["none", "low", "medium", "high", "xhigh"]
default = "medium"

[reasoning.source]
url = "https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/reasoning"
verified = "2026-08-18"
