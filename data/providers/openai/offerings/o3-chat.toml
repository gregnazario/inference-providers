model = "openai/o3"
wire_id = "o3"
endpoint = "v1-chat-completions"
status = "ga"
status_date = ""

[cost]
input = 2.0
output = 8.0
cache_read = 0.5
source = { url = "https://developers.openai.com/api/docs/pricing", verified = "2026-08-20" }

[limits]
context = 200_000
output = 100_000
source = { url = "https://developers.openai.com/api/docs/models", verified = "2026-08-19" }

[reasoning]
style = "effort"
mandatory = true
default = "on"
returns = "hidden"
must_round_trip = ""
incompatible_with = ["temperature", "top_p"]

[reasoning.effort]
param = "reasoning_effort"
values = ["low", "medium", "high"]
default = "medium"

[reasoning.source]
url = "https://developers.openai.com/api/docs/guides/reasoning"
verified = "2026-08-18"
