model = "anthropic/claude-sonnet-4-5"
wire_id = "claude-sonnet-4-5"
endpoint = "messages"
status = "ga"
status_date = ""

[reasoning]
style = "budget"
mandatory = false
default = "on"
notes = "Reasoning follows the upstream wire format on this surface; cloned from Anthropic's native offering."
returns = "thinking_blocks"
must_round_trip = "signature"
incompatible_with = ["temperature", "top_p", "top_k"]

[reasoning.toggle]
param = "thinking.type"
on = "enabled"
off = "disabled"

[reasoning.budget]
param = "thinking.budget_tokens"
min = 1024
max = 128_000
zero_means_off = false
constraint = "must be < max_tokens"

[reasoning.source]
url = "https://opencode.ai/zen/v1/models"
verified = "2026-08-19"
