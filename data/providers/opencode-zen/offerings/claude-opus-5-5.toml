model = "anthropic/claude-opus-5-5"
wire_id = "claude-opus-5-5"
endpoint = "messages"
status = "ga"
status_date = ""

[cost]
input = 4.0
output = 20.0
cache_read = 0.2
cache_write = 5.0
source = { url = "https://opencode.ai/docs/zen", verified = "2026-09-23" }

[reasoning]
style = "adaptive"
mandatory = false
default = "adaptive"
returns = "thinking_blocks"
must_round_trip = "signature"
notes = "Reasoning follows the upstream wire format on this surface; cloned from Anthropic's native offering. 5-series accepts thinking.type disabled only at effort ≤ high; effort changes invalidate prompt-cache breakpoints."
incompatible_with = ["temperature", "top_p", "top_k", "prefill"]

[reasoning.effort]
param = "output_config.effort"
values = ["low", "medium", "high", "xhigh", "max"]
default = "high"

[reasoning.source]
url = "https://opencode.ai/zen/v1/models"
verified = "2026-09-23"
