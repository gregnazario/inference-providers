model = "xai/grok-4-7"
wire_id = "grok-4.7"
endpoint = "responses"
status = "ga"
status_date = ""

[cost]
input = 2.0
output = 6.0
cache_read = 0.5
notes = "Up to 200K prompt tokens; over 200K $4/$12."
source = { url = "https://opencode.ai/docs/zen", verified = "2026-09-23" }

[features]
streaming = true
tools = true
structured_output = true
prompt_caching = true
vision = true

[reasoning]
style = "effort"
mandatory = false
default = "on"
returns = "reasoning_summary"
must_round_trip = "encrypted_content"
incompatible_with = ["temperature", "top_p"]
notes = "Cloned from xAI's native offering."

[reasoning.effort]
param = "reasoning.effort"
values = ["low", "medium", "high", "xhigh"]
default = "low"

[reasoning.source]
url = "https://opencode.ai/zen/v1/models"
verified = "2026-09-23"
