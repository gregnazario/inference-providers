model = "openai/gpt-5-5"
wire_id = "gpt-5.5-pro"
endpoint = "responses"
status = "ga"
status_date = ""
[cost]
input = 30
output = 180
cache_read = 30
source = { url = "https://opencode.ai/docs/zen", verified = "2026-08-28" }
[features]
streaming = true
tools = true
structured_output = true
prompt_caching = true
vision = false
[reasoning]
style = "effort"
mandatory = true
default = "on"
notes = "Pro serving tier of GPT-5.5; default effort high."
returns = "reasoning_summary"
must_round_trip = "encrypted_content"
incompatible_with = ["temperature", "top_p"]

[reasoning.effort]
param = "reasoning.effort"
values = ["medium", "high", "xhigh"]
default = "high"

[reasoning.source]
url = "https://opencode.ai/zen/v1/models"
verified = "2026-08-28"
