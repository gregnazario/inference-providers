model = "openai/gpt-5-4-mini"
wire_id = "gpt-5.4-mini"
endpoint = "responses"
status = "ga"
status_date = ""
[cost]
input = 0.75
output = 4.5
cache_read = 0.075
source = { url = "https://opencode.ai/docs/zen", verified = "2026-08-28" }
[features]
streaming = true
tools = true
structured_output = true
prompt_caching = true
vision = false
[reasoning]
style = "effort"
mandatory = false
default = "off"
notes = "Cloned from OpenAI's native offering; default effort none."
returns = "reasoning_summary"
must_round_trip = "encrypted_content"
incompatible_with = ["temperature", "top_p"]

[reasoning.effort]
param = "reasoning.effort"
values = ["none", "low", "medium", "high", "xhigh"]
default = "none"

[reasoning.source]
url = "https://opencode.ai/zen/v1/models"
verified = "2026-08-28"
