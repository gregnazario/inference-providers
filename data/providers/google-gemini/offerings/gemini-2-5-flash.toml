model = "google/gemini-2-5-flash"
wire_id = "gemini-2.5-flash"
endpoint = "generate-content"
status = "ga"
status_date = ""

[limits]
context = 1_048_576
output = 65_536
source = { url = "https://ai.google.dev/gemini-api/docs/models", verified = "2026-08-19" }

[reasoning]
style = "budget"
mandatory = false
default = "on"
returns = "thought_parts"
must_round_trip = "thought_signature"

[reasoning.budget]
param = "generationConfig.thinkingConfig.thinkingBudget"
min = 1
max = 24_576
zero_means_off = true
special_values = { "-1" = "dynamic" }

[reasoning.source]
url = "https://docs.cloud.google.com/vertex-ai/generative-ai/docs/thinking"
verified = "2026-08-18"
