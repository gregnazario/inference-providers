model = "google/gemini-3-7-flash"
wire_id = "gemini-3.7-flash"
endpoint = "generate-content"
status = "ga"
status_date = ""

[cost]
input = 0.75
output = 3.75
cache_read = 0.075
free = false
source = { url = "https://ai.google.dev/gemini-api/docs/pricing", verified = "2026-08-19" }

[limits]
context = 1_048_576
output = 65_536
source = { url = "https://ai.google.dev/gemini-api/docs/models", verified = "2026-08-19" }

[reasoning]
style = "effort"
mandatory = true
default = "on"
notes = "minimal unsupported (errors); thinkingLevel replaces thinkingBudget; temperature/top_p/top_k deprecated on 3.6/3.7."
returns = "thought_parts"
must_round_trip = "thought_signature"

[reasoning.effort]
param = "generationConfig.thinkingConfig.thinkingLevel"
values = ["low", "medium", "high"]
default = "medium"

[reasoning.source]
url = "https://ai.google.dev/gemini-api/docs/thinking"
verified = "2026-08-19"
