model = "google/gemini-3-1-pro"
wire_id = "gemini-3.1-pro-preview"
endpoint = "generate-content"
status = "preview"
status_date = ""

[cost]
input = 2.0
output = 12.0
cache_read = 0.2
notes = "≤200K tier; >200K doubles"
source = { url = "https://ai.google.dev/gemini-api/docs/pricing", verified = "2026-08-21" }

[limits]
context = 1_048_576
output = 65_536
source = { url = "https://ai.google.dev/gemini-api/docs/models", verified = "2026-08-21" }

[reasoning]
style = "effort"
mandatory = true
default = "on"
notes = "thinkingLevel replaces thinkingBudget on Gemini 3; cannot disable thinking."
returns = "thought_parts"
must_round_trip = "thought_signature"

[reasoning.effort]
param = "generationConfig.thinkingConfig.thinkingLevel"
values = ["low", "medium", "high"]
default = "high"

[reasoning.source]
url = "https://ai.google.dev/gemini-api/docs/thinking"
verified = "2026-08-21"
