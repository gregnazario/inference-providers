            - generic [ref=f4e711]:
              - text: Token Plan and Coding Plan keys share the same
              - code [ref=f4e712]: sk-sp-
              - text: prefix but are not interchangeable — each key is bound to a specific plan and base URL. Do not mix them.
            - heading [level=3] [ref=f4e713]:
              - link [ref=f4e715] [cursor=pointer]:
                - /url: "#echo-works-but-code-reports-no-api-key-found"
              - text: echo works but code reports "no API key found"
            - strong [ref=f4e720]:
              - text: "Q: I used the"
              - code [ref=f4e721]: echo
              - text: command and confirmed the environment variable was set correctly. Why does my code still report that the API key cannot be found?
            - generic [ref=f4e722]: "A: This can occur for the following reasons:"
            - list [ref=f4e723]:
              - listitem [ref=f4e724]:
                - text: "Scenario 1:"
                - strong [ref=f4e725]: A temporary environment variable was set
                - text: . A temporary variable is valid only within the current terminal session and does not affect running IDEs or other applications. Refer to
                - link "Configure your API key" [ref=f4e726] [cursor=pointer]:
                  - /url: /api-reference/preparation/export-api-key-env
                - text: to set a permanent environment variable.
              - listitem [ref=f4e727]:
                - text: "Scenario 2:"
                - strong [ref=f4e728]: The IDE, command-line tool, or application was not restarted
                - text: . You must restart your IDE (such as VS Code) or terminal to load the new environment variables. If you set the environment variable after deploying an application, you must restart the application service.
              - listitem [ref=f4e729]:
                - text: "Scenario 3:"
                - strong [ref=f4e730]: The variable is missing from a service configuration file
                - text: . If your application is started by a service manager (such as systemd or supervisord), you may need to add the environment variable to the service manager's configuration file.
              - listitem [ref=f4e731]:
                - text: "Scenario 4:"
                - strong [ref=f4e732]:
                  - text: Using the
                  - code [ref=f4e733]: sudo
                  - text: command
                - text: .
                - code [ref=f4e734]: sudo
                - text: does not inherit all environment variables by default. Use
                - code [ref=f4e735]: sudo -E python xx.py
                - text: where the
                - code [ref=f4e736]: "-E"
                - text: parameter ensures that environment variables are passed.
